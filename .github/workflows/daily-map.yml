name: Map of the Day

on:
  schedule:
    # Nominally 00:05 UTC, but GitHub runs scheduled jobs when it has
    # room and in practice this one lands between 04:15 and 04:40. That
    # is fine and the schedule does not need defending: the file carries
    # yesterday, today and tomorrow, and each device reads the row for
    # its own local day, so the map turns over at the reader's midnight
    # whenever the job happened to run. The picks are computed offline
    # from the committed pool, so this job does not depend on loc.gov
    # being up either.
    #
    # The job needs the committed today.json to be present, which the
    # checkout below provides: days it already carries are copied across
    # rather than chosen again, so a map already on screens cannot move.
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-map
  cancel-in-progress: false

jobs:
  pick-map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Enough history to rebase onto a push that landed while this
          # job was running, without cloning the whole daily history.
          fetch-depth: 20

      - name: Pick today's map
        run: python3 daily.py

      # The queue a person reviews, kept a fortnight ahead on its own.
      # Built here rather than on demand because it walks every cell for
      # fourteen days and measures the ink on each pick, which is a
      # minute of HEADs -- and because a queue only useful when someone
      # remembers to ask for it is a queue that goes stale. It never
      # fails the run: a stale queue is worth less than today's map.
      - name: Write the review queue
        continue-on-error: true
        run: python3 daily.py --review 14

      # The other queue: the topics nearest their starring threshold,
      # with enough undecided maps in each to clear it. Six topics
      # rather than the postcard recipe's twelve, because rows here
      # average 358 bytes against 208 and twelve would be half a
      # megabyte -- six is 184 stars of work and 190KB.
      #
      # After --review, because both read the same pool and this is the
      # cheaper of the two to lose: a stale curation queue costs a pass
      # aimed at topics that have since moved, where a stale review
      # queue ships a bad map.
      - name: Write the curation queue
        continue-on-error: true
        run: python3 daily.py --curate

      # And draw them both, into docs/ where Pages serves them. The
      # dated page carries
      # every thumbnail inline, so building it is a minute of fetching
      # -- which is exactly why it belongs on the schedule and not on
      # somebody remembering to ask.
      - name: Draw the review page
        continue-on-error: true
        run: |
          pip install --quiet pillow
          python3 review_page.py

      - name: Commit and push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add map.json today.json review.json curate.json docs

          if git diff --staged --quiet; then
            echo "Same map as the last run, nothing to commit"
          else
            git commit -m "Update map of the day [$(date -u +'%Y-%m-%d')]"
            # A rejected push means the other workflow committed while
            # this job was running, not that anything is wrong. Rebase
            # and retry rather than failing the run.
            for attempt in 1 2 3; do
              if git push; then
                echo "Pushed."
                exit 0
              fi
              echo "Push rejected, rebasing on origin (attempt $attempt)"
              git pull --rebase origin "$GITHUB_REF_NAME" || exit 1
              sleep $((attempt * 5))
            done
            echo "Could not push after 3 attempts"
            exit 1
          fi
