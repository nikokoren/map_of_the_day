# The TRMNL side of the recipe: the polling URL and the settings a person
# sees when they install it. Paste these fields into the private plugin's
# form builder, or import this file directly.
#
# No custom field is interpolated into the polling URL. Every choice is
# made in the markup against one static feed, which is what lets someone
# combine themes and eras without a file per combination.
#
# TRMNL stores a value derived from each option rather than the option
# itself -- "The 1700s" is stored as "the_1700s" -- so the labels below
# can be edited freely: the feed ships every spelling each one could
# arrive as, and the markup looks the value up rather than matching it.
---
name: Map of the Day
strategy: polling
refresh_interval: 60
polling_verb: get
polling_url: https://raw.githubusercontent.com/nikokoren/map_of_the_day/main/today.json

custom_fields:
  - keyname: about
    name: About This Plugin
    category: education,discovery
    field_type: author_bio
    description: >-
      You were born a few centuries too late to be an explorer. This is the
      next best thing. <br><br> A historical map on your TRMNL every morning,
      straight from the Library of Congress. Bird's-eye views of American
      towns drawn when they were still half prairie, sea charts engraved for
      the Royal Navy, railway lines pushing west, battle plans sketched in the
      field, and world maps from before anyone had seen the whole world.
      Nearly five thousand of them &mdash; the oldest from 1450, none younger
      than 1929. <br><br> Choose your own territory &mdash; city plans from
      the 1700s, bird's-eye views from the 1890s, sea charts from any century
      at all &mdash; or choose nothing, and let the collection decide where
      you are going today. It will not repeat itself for years. <br><br> Every
      map arrives with its title, its maker, and where it was printed, and the
      same one stays with you all day, which is long enough to find the street
      you live on, or a coastline nobody had finished charting. <br><br> No
      account, no API key, nothing to maintain. <br><br> Install (don't Fork!)
      to receive future updates.
    email_address: isarworks@gmail.com

  - keyname: themes
    name: Themes
    field_type: select
    multiple: true
    description: >-
      What kinds of map to draw from. Pick as many as you like, or none for
      all of them. Hold cmd (or ctrl) to select more than one.
    options:
      - City Plans
      - Bird's-Eye Views
      - Civil War
      - Railroads
      - Roads & Travel
      - Revolutionary War
      - Land & Property
      - Battles & Forts
      - Nautical Charts
      - Exploration
      - World & Hemispheres

  - keyname: eras
    name: Eras
    field_type: select
    multiple: true
    description: >-
      Which centuries to draw from. Leave empty for any era. Note that not
      every combination exists -- there are no 1700s railroad maps.
    options:
      - The 1700s
      - 1800 - 1849
      - 1850 - 1869
      - 1870 - 1899
      - 1900 - 1929

  - keyname: show_caption
    name: Show the caption
    field_type: boolean
    description: >-
      The title block over the map. Switch it off for the map alone,
      edge to edge, with nothing written on it.

  - keyname: show_description
    name: Show a line of context
    field_type: boolean
    description: >-
      Adds one sentence about the map under the title. About 6% of maps
      have none, so the line is simply absent on those days.

  - keyname: show_credit
    name: Show the Library of Congress credit
    field_type: boolean
    description: >-
      Prints the credit line in the footer. Worth leaving on if you share
      pictures of the screen.
